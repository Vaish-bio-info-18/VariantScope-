
<section class="upload-panel" aria-labelledby="upload-heading">
  <div class="upload-heading">
    <div>
      <h2 id="upload-heading">Analyze your VCF</h2>
      <p>Upload a VCF file to inspect and annotate genomic variants.</p>
    </div>
    <span class="upload-badge">REAL DATA</span>
  </div>

  <label for="vcf-file" class="vcf-dropzone">
    <span class="upload-icon">↑</span>
    <strong>Choose a VCF file</strong>
    <span>Supported format: .vcf or .vcf.gz*</span>
    <input
      id="vcf-file"
      type="file"
      accept=".vcf,.gz,.vcf.gz,text/plain"
    />
  </label>

  <p id="selected-file-name" aria-live="polite">
    No file selected
  </p>

  <div class="upload-options">
    <label for="genome-build">Reference assembly</label>
    <select id="genome-build">
      <option value="GRCh38">GRCh38</option>
      <option value="GRCh37">GRCh37</option>
    </select>
  </div>

  <button id="annotate-btn" type="button" disabled>
    Parse and annotate variants
  </button>

  <p id="upload-status" role="status" aria-live="polite">
    Select a VCF file to begin.
  </p>
</section>
